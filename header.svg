<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" role="img" aria-labelledby="title desc">
  <title id="title">Nishat Raihana Prantik — Software Engineer</title>
  <desc id="desc">Software Engineer from Dhaka, Bangladesh, crafting reactive, high-performance front-end experiences with React, Next.js, Angular and TypeScript.</desc>

  <style>
    .serif { font-family: Georgia, "Times New Roman", Times, serif; }
    .sans  { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .mono  { font-family: "JetBrains Mono", Consolas, "SFMono-Regular", Menlo, Monaco, monospace; }

  </style>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0b0f19"/>
      <stop offset="55%"  stop-color="#111827"/>
      <stop offset="100%" stop-color="#0a0d14"/>
    </linearGradient>

    <radialGradient id="glow-crimson" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#dd0031" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#dd0031" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-cool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#3b82f6" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#f3dfb2"/>
      <stop offset="100%" stop-color="#c9a24e"/>
    </linearGradient>
    <linearGradient id="rule" gradientUnits="userSpaceOnUse" x1="160" y1="0" x2="560" y2="0">
      <stop offset="0%"   stop-color="#c9a24e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#c9a24e" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="seal" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0%"   stop-color="#1c2333"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </radialGradient>

    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#f5efe3" fill-opacity="0.045"/>
    </pattern>

    <path id="ring" d="M 960,210 m -118,0 a 118,118 0 1,1 236,0 a 118,118 0 1,1 -236,0"/>

    <clipPath id="type-clip">
      <rect x="96" y="300" width="520" height="36">
        <animate attributeName="width" values="0;0;520" keyTimes="0;0.3;1" dur="3.4s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <!-- Canvas -->
  <rect width="1200" height="420" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="18" fill="url(#dots)"/>
  <circle cx="960" cy="210" r="300" fill="url(#glow-crimson)"/>
  <circle cx="140" cy="40"  r="320" fill="url(#glow-cool)"/>

  <!-- Classic double rule frame -->
  <rect x="18" y="18" width="1164" height="384" rx="10" fill="none" stroke="#c9a24e" stroke-opacity="0.28"/>
  <rect x="25" y="25" width="1150" height="370" rx="7"  fill="none" stroke="#c9a24e" stroke-opacity="0.12"/>
  <g fill="#c9a24e" fill-opacity="0.75">
    <path d="M18 31 l4 -4 l4 4 l-4 4 z" transform="translate(-4 -9)"/>
    <path d="M1178 31 l4 -4 l4 4 l-4 4 z" transform="translate(0 -9)"/>
    <path d="M18 389 l4 -4 l4 4 l-4 4 z" transform="translate(-4 13)"/>
    <path d="M1178 389 l4 -4 l4 4 l-4 4 z" transform="translate(0 13)"/>
  </g>

  <!-- Eyebrow -->
  <text x="82" y="122" class="sans" font-size="13" font-weight="600" letter-spacing="5" fill="#ff4d6d">SOFTWARE ENGINEER  ·  DHAKA, BANGLADESH</text>

  <!-- Name -->
  <text x="80" y="192" class="serif" font-size="58" fill="#f5efe3">Nishat Raihana <tspan font-style="italic" fill="url(#gold)">Prantik</tspan></text>

  <!-- Ornamental rule -->
  <g>
    <line x1="82" y1="224" x2="132" y2="224" stroke="#c9a24e" stroke-opacity="0.9"/>
    <path d="M140 224 l6 -6 l6 6 l-6 6 z" fill="#c9a24e"/>
    <line x1="160" y1="224" x2="560" y2="224" stroke="url(#rule)"/>
  </g>

  <!-- Tagline -->
  <text x="82" y="266" class="serif" font-size="21" font-style="italic" fill="#cbd5e1">Crafting reactive, high-performance front-end experiences.</text>

  <!-- Terminal line with typing reveal -->
  <g>
    <rect x="80" y="296" width="560" height="44" rx="10" fill="#0d1117" stroke="#273043"/>
    <g clip-path="url(#type-clip)">
      <text x="100" y="324" class="mono" font-size="15" textLength="500" lengthAdjust="spacing" fill="#e2e8f0"><tspan fill="#ff4d6d">const</tspan> craft = [<tspan fill="#f3dfb2">'React'</tspan>, <tspan fill="#f3dfb2">'Next.js'</tspan>, <tspan fill="#f3dfb2">'Angular'</tspan>, <tspan fill="#f3dfb2">'TypeScript'</tspan>];</text>
    </g>
    <rect x="606" y="310" width="9" height="19" rx="1.5" fill="#ff4d6d">
      <animate attributeName="x" values="100;100;606" keyTimes="0;0.3;1" dur="3.4s" fill="freeze"/>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Monogram seal -->
  <g>
    <circle cx="960" cy="210" r="150" fill="none" stroke="#f5efe3" stroke-opacity="0.10"/>
    <circle cx="960" cy="210" r="140" fill="none" stroke="#c9a24e" stroke-opacity="0.35" stroke-dasharray="2 6"/>

    <!-- Orbiting accent -->
    <g>
      <circle cx="960" cy="60" r="4.5" fill="#ff4d6d"/>
      <circle cx="960" cy="60" r="10"  fill="#ff4d6d" fill-opacity="0.18"/>
      <animateTransform attributeName="transform" type="rotate" from="0 960 210" to="360 960 210" dur="14s" repeatCount="indefinite"/>
    </g>

    <!-- Rotating inscription -->
    <g>
      <text class="sans" font-size="12.5" font-weight="600" fill="#cbd5e1" fill-opacity="0.85">
        <textPath href="#ring" textLength="735" lengthAdjust="spacing">SOFTWARE ENGINEER • FRONTEND SPECIALIST • TECHNICAL WRITER • </textPath>
      </text>
      <animateTransform attributeName="transform" type="rotate" from="0 960 210" to="-360 960 210" dur="60s" repeatCount="indefinite"/>
    </g>

    <circle cx="960" cy="210" r="98" fill="url(#seal)" stroke="#dd0031" stroke-opacity="0.85" stroke-width="1.5"/>
    <circle cx="960" cy="210" r="90" fill="none" stroke="#c9a24e" stroke-opacity="0.35"/>

    <path d="M960 152 l3.2 8.8 l8.8 3.2 l-8.8 3.2 l-3.2 8.8 l-3.2 -8.8 l-8.8 -3.2 l8.8 -3.2 z" fill="#ff4d6d"/>
    <text x="960" y="226" class="serif" font-size="46" text-anchor="middle" letter-spacing="3" fill="#f5efe3">NRP</text>
    <line x1="936" y1="242" x2="984" y2="242" stroke="#c9a24e" stroke-opacity="0.8"/>
    <text x="960" y="262" class="sans" font-size="9.5" font-weight="600" text-anchor="middle" letter-spacing="4" fill="#94a3b8">FRONT-END</text>
  </g>
</svg>
