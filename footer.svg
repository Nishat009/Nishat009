<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="100%" role="img" aria-labelledby="title">
  <title id="title">Thank you for visiting — let's build something remarkable.</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#dd0031" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#dd0031" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule-l" gradientUnits="userSpaceOnUse" x1="420" y1="0" x2="584" y2="0">
      <stop offset="0%"   stop-color="#c9a24e" stop-opacity="0"/>
      <stop offset="100%" stop-color="#c9a24e" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="rule-r" gradientUnits="userSpaceOnUse" x1="616" y1="0" x2="780" y2="0">
      <stop offset="0%"   stop-color="#c9a24e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#c9a24e" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="150" rx="18" fill="url(#bg)"/>
  <ellipse cx="600" cy="75" rx="420" ry="120" fill="url(#glow)"/>
  <rect x="18" y="14" width="1164" height="122" rx="10" fill="none" stroke="#c9a24e" stroke-opacity="0.25"/>

  <text x="600" y="72" text-anchor="middle" font-family="Georgia, 'Times New Roman', Times, serif" font-size="26" font-style="italic" fill="#f5efe3">Thank you for visiting — let's build something remarkable.</text>

  <line x1="420" y1="100" x2="584" y2="100" stroke="url(#rule-l)"/>
  <path d="M600 92 l8 8 l-8 8 l-8 -8 z" fill="#dd0031"/>
  <line x1="616" y1="100" x2="780" y2="100" stroke="url(#rule-r)"/>
</svg>
